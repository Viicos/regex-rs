name: ci

on:
  push:
    branches:
      - main
    tags:
      - '**'
  pull_request: {}

permissions:
  contents: read

jobs:
  tests:
    name: Run tests with pytest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15', 'pypy3.11', 'graalpy3.12', 'graalpy3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true # zizmor: ignore[cache-poisoning] (Job does not produce release artifacts and does not have sensitive permissions)

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run pytest
        run: uv run pytest

  rust-tests:
    name: Run Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run cargo test
        run: cargo test --locked

  msrv:
    name: Check minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve MSRV
        id: resolve-msrv
        run: echo "MSRV=$(cargo metadata --format-version 1 --no-deps --frozen --quiet --offline | jq -r '.packages[0].rust_version')" >> "$GITHUB_OUTPUT"

      - name: Install the MSRV toolchain
        run: rustup toolchain install "$MSRV" --profile minimal
        env:
          MSRV: ${{ steps.resolve-msrv.outputs.MSRV }}

      - name: Run cargo check
        run: cargo "+$MSRV" check --locked
        env:
          MSRV: ${{ steps.resolve-msrv.outputs.MSRV }}

  docs:
    name: Build and check documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.15
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: '3.15'
          enable-cache: true # zizmor: ignore[cache-poisoning] (Job does not produce release artifacts and does not have sensitive permissions)

      - name: Install dependencies
        run: uv sync --group docs

      - name: Lint docs with sphinx-lint
        run: |
          uv run sphinx-lint docs

      - name: Build docs and check the integrity of external links
        run: |
          uv run sphinx-build --builder linkcheck --fail-on-warning "source" "build"
          uv run sphinx-build --builder html --fail-on-warning "source" "build"
        working-directory: ./docs

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to attest build provenance, verified by the release job:
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          # Keep in sync with `build-system.requires` in `pyproject.toml`:
          maturin-version: v1.16.0
          command: sdist
          args: --out dist
          rust-toolchain: stable

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          subject-path: dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi_files_sdist
          path: dist

  # Reference documentation: https://pyo3.rs/v0.30.1/building-and-distribution.html#py_limited_apiabi3abi3t.
  build:
    name: Build wheels on ${{ matrix.os }} (${{ matrix.target }}${{ matrix.os == 'linux' && format(' - {0}', matrix.manylinux) || '' }}${{ matrix.implementation && format(' - {0}', matrix.implementation) || '' }})
    permissions:
      contents: read
      # Required to attest build provenance, verified by the release job:
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runs-on: ubuntu-latest
            target: x86_64
            manylinux: auto
          - os: linux
            runs-on: ubuntu-24.04-arm
            target: aarch64
            manylinux: auto
          - os: linux
            runs-on: ubuntu-latest
            target: x86_64
            manylinux: musllinux_1_2
          - os: linux
            runs-on: ubuntu-24.04-arm
            target: aarch64
            manylinux: musllinux_1_2
          - os: macos
            runs-on: macos-latest
            target: x86_64
          - os: macos
            runs-on: macos-latest
            target: aarch64
          - os: windows
            runs-on: windows-latest
            target: x86_64
          - os: windows
            runs-on: windows-11-arm
            target: aarch64
          # Cross-compiled, and tested under emulation by the `test-builds-emulated` job.
          # `s390x-unknown-linux-musl` is a tier 3 Rust target (no prebuilt standard library), so no musllinux s390x wheel.
          - os: linux
            # Network access (needed by maturin-action to install `libatomic`) is broken
            # in the `manylinux2014_i686` image on `ubuntu-26.04` runners:
            runs-on: ubuntu-24.04
            target: i686
            manylinux: auto
          - os: linux
            runs-on: ubuntu-latest
            target: i686
            manylinux: musllinux_1_2
          - os: linux
            runs-on: ubuntu-latest
            target: armv7
            manylinux: auto
          - os: linux
            runs-on: ubuntu-latest
            target: armv7
            manylinux: musllinux_1_2
          - os: linux
            runs-on: ubuntu-latest
            target: ppc64le
            manylinux: auto
          - os: linux
            runs-on: ubuntu-latest
            target: ppc64le
            manylinux: musllinux_1_2
          - os: linux
            runs-on: ubuntu-latest
            target: s390x
            manylinux: auto
          - os: linux
            runs-on: ubuntu-latest
            target: riscv64gc-unknown-linux-gnu
            manylinux: auto
          - os: linux
            runs-on: ubuntu-latest
            target: riscv64gc-unknown-linux-musl
            manylinux: musllinux_1_2

          # PyPy is not supported by `abi3`, so a version-specific wheel is built for PyPy 3.11.
          # PyPy 3.11 exists with both the PyPy 7.3 (`pp73`) and 8.0 (`pp80`) ABIs, only the latter is supported.
          - os: linux
            runs-on: ubuntu-latest
            target: x86_64
            # PyPy 8.0 requires glibc 2.28:
            manylinux: '2_28'
            implementation: pypy
            # `pypy3.11` resolves to PyPy 7.3 in the manylinux images (see https://github.com/pypa/manylinux/pull/1996):
            interpreter: /opt/python/pp311-pypy311_pp80/bin/python
          - os: linux
            runs-on: ubuntu-24.04-arm
            target: aarch64
            manylinux: '2_28'
            implementation: pypy
            interpreter: /opt/python/pp311-pypy311_pp80/bin/python
          # On macOS and Windows, the interpreter is provided by the "Install PyPy" step below:
          - os: macos
            runs-on: macos-latest
            target: x86_64
            implementation: pypy
          - os: macos
            runs-on: macos-latest
            target: aarch64
            implementation: pypy
          - os: windows
            runs-on: windows-latest
            target: x86_64
            implementation: pypy

          # GraalPy is not supported by `abi3` either.
          - os: linux
            runs-on: ubuntu-latest
            target: x86_64
            # GraalPy 3.13 is only provided by the `manylinux_2_28` images:
            manylinux: '2_28'
            implementation: graalpy
            interpreter: graalpy3.12 graalpy3.13
          - os: linux
            runs-on: ubuntu-24.04-arm
            target: aarch64
            manylinux: '2_28'
            implementation: graalpy
            interpreter: graalpy3.12 graalpy3.13
          # On macOS and Windows, the interpreters are provided by the "Install GraalPy" step below.
          # GraalPy is not distributed for macOS x86_64 anymore.
          - os: macos
            runs-on: macos-latest
            target: aarch64
            implementation: graalpy
          - os: windows
            runs-on: windows-latest
            target: x86_64
            implementation: graalpy

    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      # On Linux, wheels are built in a manylinux/musllinux container providing the interpreters.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: matrix.os != 'linux' && !matrix.implementation
        with:
          python-version: |
            3.11
            3.14t
            3.15

      # Wheels built:
      # - an `abi3` wheel with Python 3.11, for GIL-enabled Python 3.11 and up.
      # - a version-specific wheel for free-threaded Python 3.14 (not supported by `abi3`).
      # - an `abi3t` wheel with Python 3.15, for both GIL-enabled and free-threaded Python 3.15 and up.
      # The `abi3t` wheel is built separately, as building it along with Python 3.11 results
      # in a version-specific Python 3.11 wheel instead of an `abi3` one (as of maturin 1.16.0).
      - name: Build abi3 and free-threaded 3.14 wheels
        if: '!matrix.implementation'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          # Keep in sync with `build-system.requires` in `pyproject.toml`:
          maturin-version: v1.16.0
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist --interpreter 3.11 3.14t
          rust-toolchain: stable

      - name: Build abi3t wheel
        if: '!matrix.implementation'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          # Keep in sync with `build-system.requires` in `pyproject.toml`:
          maturin-version: v1.16.0
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist --interpreter 3.15
          rust-toolchain: stable

      # `pypy3.11` may resolve to PyPy 7.3 on the runners, so the latest PyPy 3.11 (PyPy 8.0) is installed with uv:
      - name: Install PyPy
        id: pypy
        if: matrix.implementation == 'pypy' && matrix.os != 'linux'
        shell: bash
        run: |
          uv python install pypy3.11
          interpreter="$(uv python find --managed-python pypy3.11)"
          "$interpreter" -c 'import sysconfig; soabi = sysconfig.get_config_var("SOABI"); assert "pp80" in soabi, soabi'
          if command -v cygpath &> /dev/null; then
            interpreter="$(cygpath --mixed "$interpreter")"
          fi
          echo "interpreter=$interpreter" >> "$GITHUB_OUTPUT"

      - name: Install GraalPy
        id: graalpy
        if: matrix.implementation == 'graalpy' && matrix.os != 'linux'
        shell: bash
        run: |
          uv python install graalpy3.12 graalpy3.13
          interpreters=()
          for version in 3.12 3.13; do
            interpreter="$(uv python find --managed-python "graalpy$version")"
            if command -v cygpath &> /dev/null; then
              interpreter="$(cygpath --mixed "$interpreter")"
            fi
            interpreters+=("$interpreter")
          done
          echo "interpreters=${interpreters[*]}" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.implementation }} wheels
        if: matrix.implementation
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          # Keep in sync with `build-system.requires` in `pyproject.toml`:
          maturin-version: v1.16.0
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist --interpreter ${{ steps.pypy.outputs.interpreter || steps.graalpy.outputs.interpreters || matrix.interpreter }}
          rust-toolchain: stable

      - name: Check built wheels
        shell: bash
        run: |
          ls -lh dist/
          case "$IMPLEMENTATION" in
            pypy) ls dist/*-pp311-pypy311_pp80-*.whl ;;
            graalpy) ls dist/*-graalpy312-graalpy*_312_native-*.whl dist/*-graalpy313-graalpy*_313_native-*.whl ;;
            *) ls dist/*-cp311-abi3-*.whl dist/*-cp314-cp314t-*.whl dist/*-cp315-abi3.abi3t-*.whl ;;
          esac
        env:
          IMPLEMENTATION: ${{ matrix.implementation }}

      - run: uv sync --only-group build

      - run: uv run --no-sync twine check --strict dist/*

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          subject-path: dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi_files_${{ matrix.os }}_${{ matrix.target }}_${{ matrix.manylinux || 'native' }}${{ matrix.implementation && format('_{0}', matrix.implementation) || '' }}
          path: dist

  test-builds:
    name: Test wheels on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
        # Pinned, as `pypy3.11` may resolve to PyPy 7.3 (`pp73` ABI) on the runners. PyPy 3.11.17 is PyPy 8.0 (`pp80` ABI):
        python-version: ['3.11', '3.14t', '3.15', '3.15t', 'pypy@3.11.17', 'graalpy3.12', 'graalpy3.13']
        exclude:
          # PyPy does not support Windows on ARM:
          - os: windows-11-arm
            python-version: pypy@3.11.17
          # GraalPy does not support Windows on ARM:
          - os: windows-11-arm
            python-version: graalpy3.12
          - os: windows-11-arm
            python-version: graalpy3.13

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true # zizmor: ignore[cache-poisoning] (Job does not produce release artifacts and does not have sensitive permissions)

      - name: Get dist artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pypi_files_*
          merge-multiple: true
          path: dist

      - run: uv sync --only-dev
      - run: uv pip install regexrs-py --no-index --no-deps --find-links dist --force-reinstall
      - run: uv run --no-sync pytest
      - run: uv run --no-sync python -c "import sys, regex_rs._regex_rs as m; print(sys.version, m.__file__, m.REGEX_VERSION)"

  # Wheels for these targets can't be tested natively on GitHub runners, so they are tested in the
  # corresponding manylinux/musllinux images (providing the interpreters), under QEMU emulation:
  test-builds-emulated:
    name: Test wheels on ${{ matrix.image }}
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: manylinux_2_28_i686
            platform: linux/386
          - image: musllinux_1_2_i686
            platform: linux/386
          - image: manylinux_2_31_armv7l
            platform: linux/arm/v7
          - image: musllinux_1_2_armv7l
            platform: linux/arm/v7
          - image: manylinux_2_28_ppc64le
            platform: linux/ppc64le
          - image: musllinux_1_2_ppc64le
            platform: linux/ppc64le
          - image: manylinux_2_28_s390x
            platform: linux/s390x
          - image: manylinux_2_39_riscv64
            platform: linux/riscv64
          - image: musllinux_1_2_riscv64
            platform: linux/riscv64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: matrix.platform != 'linux/386'

      - name: Get dist artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pypi_files_linux_*
          merge-multiple: true
          path: dist

      - name: Run pytest
        run: |
          docker run --rm --platform "$PLATFORM" --env PYTHONDONTWRITEBYTECODE=1 --volume "$PWD:/io" --workdir /io "quay.io/pypa/$IMAGE" bash -euo pipefail -c '
            for python in /opt/python/cp311-cp311 /opt/python/cp314-cp314t /opt/python/cp315-cp315 /opt/python/cp315-cp315t; do
              venv="/tmp/$(basename "$python")"
              "$python/bin/python" -m venv "$venv"
              "$venv/bin/python" -m pip install --quiet pytest
              "$venv/bin/python" -m pip install --quiet regexrs-py --no-index --no-deps --find-links dist
              "$venv/bin/python" -m pytest -p no:cacheprovider
              "$venv/bin/python" -c "import sys, regex_rs._regex_rs as m; print(sys.version, m.__file__, m.REGEX_VERSION)"
            done
          '
        env:
          IMAGE: ${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}

  build-pyemscripten:
    name: Build wheels on PyEmscripten (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to attest build provenance, verified by the release job:
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.14'
            pyodide-version: '314.0.7'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: false

      - run: uv sync --only-group pyodide-build

      - run: uv run pyodide xbuildenv install "$PYODIDE_VERSION"
        env:
          PYODIDE_VERSION: ${{ matrix.pyodide-version }}
          UV_NO_SYNC: '1'

      - name: Get Pyodide config
        id: pyodide-config
        run: |
          echo "rust-toolchain=$(uv run pyodide config get rust_toolchain)" >> "$GITHUB_OUTPUT"
          echo "emscripten-version=$(uv run pyodide config get emscripten_version)" >> "$GITHUB_OUTPUT"
          echo "pyodide-abi-version=$(uv run pyodide config get pyodide_abi_version)" >> "$GITHUB_OUTPUT"
          echo "rustflags=$(uv run pyodide config get rustflags)" >> "$GITHUB_OUTPUT"
        env:
          UV_NO_SYNC: '1'

      - uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: ${{ steps.pyodide-config.outputs.emscripten-version }}
          no-cache: true

      # Wheels built:
      # - an `abi3` wheel, for Python 3.11 and up (in practice, the Python version of the Pyodide release).
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        # Unclear how to avoid manually specifying this yet (https://github.com/PyO3/maturin/issues/3189):
        env:
          CARGO_TARGET_WASM32_UNKNOWN_EMSCRIPTEN_RUSTFLAGS: ${{ steps.pyodide-config.outputs.rustflags }}
          MATURIN_PYEMSCRIPTEN_PLATFORM_VERSION: ${{ steps.pyodide-config.outputs.pyodide-abi-version }}
        with:
          # Keep in sync with `build-system.requires` in `pyproject.toml`:
          maturin-version: v1.16.0
          target: wasm32-unknown-emscripten
          args: --release --locked --out dist --interpreter ${{ matrix.python-version }}
          rust-toolchain: ${{ steps.pyodide-config.outputs.rust-toolchain }}

      - name: Check built wheels
        run: |
          ls -lh dist/
          ls dist/*-cp311-abi3-pyemscripten_"$PYODIDE_ABI_VERSION"_wasm32.whl
        env:
          PYODIDE_ABI_VERSION: ${{ steps.pyodide-config.outputs.pyodide-abi-version }}

      - run: uv sync --only-group build

      - run: uv run --no-sync twine check --strict dist/*

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          subject-path: dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi_files_pyemscripten_${{ matrix.python-version }}
          path: dist

  test-pyemscripten:
    name: Test wheels on PyEmscripten (Python ${{ matrix.python-version }})
    needs: [build-pyemscripten]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.14'
            pylock-suffix: '314'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true # zizmor: ignore[cache-poisoning] (Job does not produce release artifacts and does not have sensitive permissions)

      - name: Get dist artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi_files_pyemscripten_${{ matrix.python-version }}
          path: dist

      - run: uv sync --only-group pyodide-build

      - run: uv run --no-sync pyodide venv .venv-pyodide

      - name: Install dependencies and run pytest
        run: |
          source .venv-pyodide/bin/activate
          python -m pip install --upgrade 'pip>=26.1.1'
          python -m pip install -r ".github/pyodide/pylock.$PYLOCK_SUFFIX.toml"
          python -m pip install regexrs-py --no-index --no-deps --find-links dist
          python -m pytest
          python -c "import sys, regex_rs._regex_rs as m; print(sys.version, m.__file__, m.REGEX_VERSION)"
        env:
          PYLOCK_SUFFIX: ${{ matrix.pylock-suffix }}

  check: # This job does nothing and is only used for the branch protection
    if: always()
    outputs:
      result: ${{ steps.all-green.outputs.result }}
    needs: [tests, rust-tests, msrv, docs, build-sdist, test-builds, test-builds-emulated, test-pyemscripten]
    runs-on: ubuntu-latest

    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        id: all-green
        with:
          jobs: ${{ toJSON(needs) }}

  release:
    needs: [check]
    if: needs.check.outputs.result == 'success' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: release

    permissions:
      id-token: write
      attestations: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - run: uv sync --only-group build

      - name: Check the tag matches the package version
        run: |
          VERSION=$(cargo metadata --format-version 1 --no-deps --frozen --quiet --offline | jq -r '.packages[0].version')
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the package version (v$VERSION)"
            exit 1
          fi

      - name: Get dist artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pypi_files_*
          merge-multiple: true
          path: dist

      - name: Verify dist artifacts provenance
        run: |
          for f in dist/*; do
            gh attestation verify "$f" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Test wheels integrity
        run: |
          for whl in dist/*.whl; do unzip -qt "$whl"; done
          uv run --no-sync twine check --strict dist/*

      - name: Upload package to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
