name: ci

on:
  push:
    branches:
      - main
    tags:
      - '**'
  pull_request: {}

permissions:
  contents: read

jobs:
  tests:
    name: Run tests with pytest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true # zizmor: ignore[cache-poisoning] (Job does not produce release artifacts and does not have sensitive permissions)

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run pytest
        run: uv run pytest

  rust-tests:
    name: Run Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run cargo test
        run: cargo test --locked

  msrv:
    name: Check minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve MSRV
        id: resolve-msrv
        run: echo "MSRV=$(cargo metadata --format-version 1 --no-deps --frozen --quiet --offline | jq -r '.packages[0].rust_version')" >> "$GITHUB_OUTPUT"

      - name: Install the MSRV toolchain
        run: rustup toolchain install "$MSRV" --profile minimal
        env:
          MSRV: ${{ steps.resolve-msrv.outputs.MSRV }}

      - name: Run cargo check
        run: cargo "+$MSRV" check --locked
        env:
          MSRV: ${{ steps.resolve-msrv.outputs.MSRV }}

  docs:
    name: Build and check documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.15
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: '3.15'
          enable-cache: true # zizmor: ignore[cache-poisoning] (Job does not produce release artifacts and does not have sensitive permissions)

      - name: Install dependencies
        run: uv sync --group docs

      - name: Lint docs with sphinx-lint
        run: |
          uv run sphinx-lint docs

      - name: Build docs and check the integrity of external links
        run: |
          uv run sphinx-build --builder linkcheck --fail-on-warning "source" "build"
          uv run sphinx-build --builder html --fail-on-warning "source" "build"
        working-directory: ./docs

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to attest build provenance, verified by the release job:
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          # Keep in sync with `build-system.requires` in `pyproject.toml`:
          maturin-version: v1.15.0
          command: sdist
          args: --out dist
          rust-toolchain: stable

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          subject-path: dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi_files_sdist
          path: dist

  # Reference documentation: https://pyo3.rs/v0.30.1/building-and-distribution.html#py_limited_apiabi3abi3t.
  build:
    name: Build wheels on ${{ matrix.os }} (${{ matrix.target }}${{ matrix.os == 'linux' && format(' - {0}', matrix.manylinux) || '' }})
    permissions:
      contents: read
      # Required to attest build provenance, verified by the release job:
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runs-on: ubuntu-latest
            target: x86_64
            manylinux: auto
          - os: linux
            runs-on: ubuntu-24.04-arm
            target: aarch64
            manylinux: auto
          - os: linux
            runs-on: ubuntu-latest
            target: x86_64
            manylinux: musllinux_1_2
          - os: linux
            runs-on: ubuntu-24.04-arm
            target: aarch64
            manylinux: musllinux_1_2
          - os: macos
            runs-on: macos-latest
            target: x86_64
          - os: macos
            runs-on: macos-latest
            target: aarch64
          - os: windows
            runs-on: windows-latest
            target: x86_64
          - os: windows
            runs-on: windows-11-arm
            target: aarch64

    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # On Linux, wheels are built in a manylinux/musllinux container providing the interpreters.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: matrix.os != 'linux'
        with:
          python-version: |
            3.11
            3.14t
            3.15

      # Wheels built:
      # - an `abi3` wheel with Python 3.11, for GIL-enabled Python 3.11 and up.
      # - a version-specific wheel for free-threaded Python 3.14 (not supported by `abi3`).
      # - an `abi3t` wheel with Python 3.15, for both GIL-enabled and free-threaded Python 3.15 and up.
      # The `abi3t` wheel is built separately, as building it along with Python 3.11 results
      # in a version-specific Python 3.11 wheel instead of an `abi3` one (as of maturin 1.15.0).
      - name: Build abi3 and free-threaded 3.14 wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          # Keep in sync with `build-system.requires` in `pyproject.toml`:
          maturin-version: v1.15.0
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist --interpreter 3.11 3.14t
          rust-toolchain: stable

      - name: Build abi3t wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          # Keep in sync with `build-system.requires` in `pyproject.toml`:
          maturin-version: v1.15.0
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist --interpreter 3.15
          rust-toolchain: stable

      - name: Check built wheels
        shell: bash
        run: |
          ls -lh dist/
          ls dist/*-cp311-abi3-*.whl dist/*-cp314-cp314t-*.whl dist/*-cp315-abi3.abi3t-*.whl

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - run: uv sync --only-group build

      - run: uv run --no-sync twine check --strict dist/*

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          subject-path: dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi_files_${{ matrix.os }}_${{ matrix.target }}_${{ matrix.manylinux || 'native' }}
          path: dist

  test-builds:
    name: Test wheels on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
        python-version: ['3.11', '3.14t', '3.15', '3.15t']

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true # zizmor: ignore[cache-poisoning] (Job does not produce release artifacts and does not have sensitive permissions)

      - name: Get dist artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pypi_files_*
          merge-multiple: true
          path: dist

      - run: uv sync --only-dev
      - run: uv pip install rustregex --no-index --no-deps --find-links dist --force-reinstall
      - run: uv run --no-sync pytest
      - run: uv run --no-sync python -c "import sys, rustregex._rustregex as m; print(sys.version, m.__file__, m.REGEX_VERSION)"

  check: # This job does nothing and is only used for the branch protection
    if: always()
    outputs:
      result: ${{ steps.all-green.outputs.result }}
    needs: [tests, rust-tests, msrv, docs, build-sdist, test-builds]
    runs-on: ubuntu-latest

    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        id: all-green
        with:
          jobs: ${{ toJSON(needs) }}

  release:
    needs: [check]
    if: needs.check.outputs.result == 'success' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: release

    permissions:
      id-token: write
      attestations: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - run: uv sync --only-group build

      - name: Check the tag matches the package version
        run: |
          VERSION=$(cargo metadata --format-version 1 --no-deps --frozen --quiet --offline | jq -r '.packages[0].version')
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the package version (v$VERSION)"
            exit 1
          fi

      - name: Get dist artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pypi_files_*
          merge-multiple: true
          path: dist

      - name: Verify dist artifacts provenance
        run: |
          for f in dist/*; do
            gh attestation verify "$f" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Test wheels integrity
        run: |
          for whl in dist/*.whl; do unzip -qt "$whl"; done
          uv run --no-sync twine check --strict dist/*

      - name: Upload package to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
