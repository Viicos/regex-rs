[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "regexrs-py"
description = "Python bindings to the Rust regex crate"
authors = [
    {name = "Victorien", email = "contact@vctrn.dev"}
]
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: GraalPy",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Rust",
    "Typing :: Typed",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"
dynamic = ["version"]

[dependency-groups]
dev = [
    "maturin>=1.15,<2",
    "pyright",
    "pytest",
    "rtfc>=0.2.0",
    "ruff",
]
docs = [
    "furo",
    "sphinx",
    "sphinx-autobuild",
    "sphinx-issues",
    "sphinx-lint",
    "sphinx-paramlinks>=0.6.0",
]
build = [
    "twine",
]
pyodide-build = [
    "pyodide-build",
]

[tool.maturin]
python-source = "python"
module-name = "regex_rs._regex_rs"

[tool.uv]
default-groups = ["dev", "docs"]

[tool.ruff]
src = ["python"]
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle (E)
    "W",      # pycodestyle (W)
    "F",      # Pyflakes
    "UP",     # pyupgrade
    "I",      # isort
    "PL",     # Pylint
    "RUF",    # Ruff
    "YTT",    # flake8-2020
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "T10",    # flake8-debugger
    "FA",     # flake8-future-annotations
    "PIE",    # flake8-pie
    "T20",    # flake8-print
    "RSE",    # flake8-raise
    "PTH",    # flake8-use-pathlib
]
ignore = [
    "PLR2004",
    "PLR0911",
]

[tool.ruff.lint.per-file-ignores]
"docs/source/conf.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["regex_rs"]

[tool.pytest]
testpaths = ["tests"]
strict = true

[tool.rtfc]
changelog = "docs/source/changelog.rst"
sections = [
    {id = "packaging", label = "Packaging"},
    {id = "change", label = "Changes"},
    {id = "feature", label = "Features"},
    {id = "bugfix", label = "Bug fixes"},
]

[tool.rtfc.render]
entry_template_file = "changelog/entry.rst.jinja"

[tool.rtfc.export.github-markdown.engine]
name = "sphinx"
sphinx_directory = "docs/source"

[tool.rtfc.metadata]
gh_issue = {type = "integer"}
gh_pr = {type = "integer"}
